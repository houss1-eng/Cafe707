# Déploiement sur Render (https://render.com) : New → Blueprint → choisir ce dépôt.
# Crée le site (https automatique) et la base PostgreSQL, reliés ensemble.
services:
  - type: web
    name: cafe-707
    runtime: node
    region: frankfurt            # le plus proche de la Tunisie
    plan: starter                # toujours allumé (le plan gratuit s'endort après 15 min)
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-707-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: PUBLIC_URL           # l'adresse finale, pour les QR codes (ex. https://commande.707.tn)
        sync: false
      - key: ADMIN_PASSWORD       # mot de passe admin créé par « npm run db:seed »
        sync: false

databases:
  - name: cafe-707-db
    region: frankfurt
    plan: basic-256mb            # sauvegardes automatiques quotidiennes (plans payants)
    databaseName: cafe707
